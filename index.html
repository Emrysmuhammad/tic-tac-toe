
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f7fb">
    <meta name="description" content="A simple, modern two-player Tic-Tac-Toe game.">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="app-shell">
        <section class="game-card" aria-labelledby="game-title">

            <header class="game-header">
                <p class="eyebrow">LOCAL MULTIPLAYER</p>
                <h1 id="game-title">Tic Tac Toe</h1>
                <p class="subtitle">
                    Three in a row. Outsmart your opponent.
                </p>
            </header>

            <section class="scoreboard" aria-label="Scoreboard">
                <div class="score-card score-x" id="player-x-card">
                    <span class="player-label">PLAYER X</span>
                    <span class="score" id="score-x">0</span>
                </div>

                <div class="score-card score-o" id="player-o-card">
                    <span class="player-label">PLAYER O</span>
                    <span class="score" id="score-o">0</span>
                </div>
            </section>

            <section class="game-area" aria-label="Game area">
                <p
                    class="game-status"
                    id="game-status"
                    role="status"
                    aria-live="polite"
                >
                    Player X's turn
                </p>

                <div class="board" id="board"
                     role="group" aria-label="Tic-Tac-Toe board">

                    <button class="cell" type="button"
                        data-cell="0" aria-label="Row 1, column 1"></button>
                    <button class="cell" type="button"
                        data-cell="1" aria-label="Row 1, column 2"></button>
                    <button class="cell" type="button"
                        data-cell="2" aria-label="Row 1, column 3"></button>

                    <button class="cell" type="button"
                        data-cell="3" aria-label="Row 2, column 1"></button>
                    <button class="cell" type="button"
                        data-cell="4" aria-label="Row 2, column 2"></button>
                    <button class="cell" type="button"
                        data-cell="5" aria-label="Row 2, column 3"></button>

                    <button class="cell" type="button"
                        data-cell="6" aria-label="Row 3, column 1"></button>
                    <button class="cell" type="button"
                        data-cell="7" aria-label="Row 3, column 2"></button>
                    <button class="cell" type="button"
                        data-cell="8" aria-label="Row 3, column 3"></button>

                </div>

                <p class="helper-text">
                    Take turns choosing a square. Get three in a row to win.
                </p>
            </section>

            <div class="game-actions">
                <button class="button button-secondary"
                    id="reset-round" type="button">
                    Reset round
                </button>

                <button class="button button-primary"
                    id="new-game" type="button">
                    New game
                </button>
            </div>

            <footer class="game-footer">
                <span>Made to play. Built to learn.</span>
                <span>Two players · Same device</span>
            </footer>

        </section>
    </main>
 
</body>
</html>
